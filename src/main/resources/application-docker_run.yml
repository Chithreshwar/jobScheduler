spring:
  docker:
    compose:
      enabled: false

  application:
    name: distributed-job-scheduler

  datasource:
    url: jdbc:postgresql://host.docker.internal:5432/distributed_job_scheduler
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: host.docker.internal
      port: 6379

logging:
  level:
    org.springframework: INFO
server:
  port: 8080
